<mat-card>

  <mat-card-header>
      <mat-card-title class="header-with-actions">
        {{ 'FORMS.TITLE' | translate }}
      </mat-card-title>

    <span class="spacer"></span>

    <button mat-flat-button color="primary" (click)="createForm()">
      <mat-icon>add</mat-icon>
      {{ 'FORMS.NEW' | translate }}
    </button>


  </mat-card-header>

  <mat-divider></mat-divider>

  <div class="table-container">
    <table mat-table [dataSource]="form" class="mat-elevation-z2">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>
          {{ 'FORMS.NAME' | translate }}
        </th>
        <td mat-header-cell *matCellDef="let form">
          {{ form.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="isEnabled">
        <th mat-header-cell *matHeaderCellDef>
          {{ 'FORMS.ENABLED' | translate }}
        </th>
        <td mat-header-cell *matCellDef="let form">
          {{ form.isEnabled }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>
          {{ 'FORMS.ACTIONS' | translate }}
        </th>
        <td mat-cell *matCellDef="let form">

          <button mat-icon-button color="primary" (click)="editForm(form)">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-icon-button color="warn" (click)="deleteForm(form)">
            <mat-icon>delete</mat-icon>
          </button>

        </td>

      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    </table>

    <mat-paginator
      [length]="totalElements"
      [pageSize]="size"
      [pageSizeOptions]="[5, 10, 20]"
      (page)="onPageChange($event)"
      >
    </mat-paginator>

  </div>

</mat-card>
