<div class="auth-container">
  <mat-card class="auth-card">
    <h2>{{ 'VERIFY.TITLE' | translate }}</h2>
    <p>{{ 'VERIFY.SUBTITLE' | translate }}</p>

    <form [formGroup]="verifyForm" (ngSubmit)="verify()">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ 'VERIFY.CODE' | translate }}</mat-label>
        <input matInput formControlName="verificationCode" type="text" required>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="verifyForm.invalid" class="full-width">
        @if(!isLoading) {
          <ng-container>{{ 'VERIFY.VERIFY_BUTTON' | translate }}</ng-container>
        } @else {
          <ng-container>
            <mat-progress-spinner diameter="24" mode="indeterminate" color="accent"></mat-progress-spinner>
          </ng-container>
        }
      </button>

    </form>

    <p class="footer-text">
      {{ 'VERIFY.NO_CODE' | translate }}
      <Button mat-button color="primary" class="link-btn" (click)="resend()">{{ 'VERIFY.RESEND' | translate }}</Button>
    </p>

  </mat-card>

</div>
