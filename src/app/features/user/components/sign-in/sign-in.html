<div class="auth-container">
  <mat-card class="auth-card">
    <h2>Welcome back</h2>
    <p>Sign in to continue</p>

    <button mat-stroked-button color="primary" class="google-btn">
      <mat-icon svgIcon="google"></mat-icon>
      Continue with Google
    </button>

    <div class="divider">
      <span>OR</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="signIn()">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password" required>
      </mat-form-field>

      <button mat-raised-button color="primary" class="full-width" type="submit" [disabled]="loginForm.invalid || isLoading">
        @if (!isLoading) {
          <ng-container>Login</ng-container>
        } @else {
          <ng-container>
            <mat-progress-spinner diameter="24" mode="indeterminate" color="accent"></mat-progress-spinner>
          </ng-container>
        }
      </button>
    </form>

    <p class="footer-text">
      Don't have an account? <a routerLink="/user/sign-up">Sign Up</a>
    </p>

  </mat-card>
</div>
